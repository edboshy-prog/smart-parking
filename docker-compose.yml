services:
  web-service:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - storage-service
    networks:
      - parking-network

  storage-service:
    image: httpd:alpine
    volumes:
      - ./storage:/usr/local/apache2/htdocs
    networks:
      - parking-network

networks:
  parking-network:
    driver: bridge