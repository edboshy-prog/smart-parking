name: Docker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build Docker containers
        run: docker compose build

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Images to GHCR (Bonus)
        if: github.event_name != 'pull_request'
        run: |
          docker tag smart-parking-web-service ghcr.io/${{ github.repository_owner }}/smart-parking-web:latest
          docker push ghcr.io/${{ github.repository_owner }}/smart-parking-web:latest
